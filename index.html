<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>E-SARABUN PLUS | ระบบสารบรรณอิเล็กทรอนิกส์</title>
    
    <!-- Google Fonts: Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        :root {
            --primary: #1e3a8a; /* Deep Navy Blue */
            --primary-light: #3b82f6; /* Bright Blue */
            --bg-color: #f1f5f9;
            --text-dark: #1e293b;
        }

        body { 
            font-family: 'Prompt', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-dark);
            padding-bottom: 90px;
            -webkit-font-smoothing: antialiased;
        }

        /* Curved Header Background */
        .header-curve {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            border-bottom-left-radius: 40px;
            border-bottom-right-radius: 40px;
            height: 220px;
            width: 100%;
            position: absolute;
            top: 0; left: 0;
            z-index: -1;
            box-shadow: 0 10px 30px rgba(30, 58, 138, 0.15);
        }

        .header-content { padding-top: 30px; }

        /* Main Container (Overlapping) */
        .main-container { margin-top: 120px; }

        /* Custom Banner Image */
        .custom-banner {
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            max-height: 120px;
            object-fit: cover;
            width: 100%;
            margin-bottom: 20px;
            background: #fff;
            padding: 5px;
        }

        /* UI Cards */
        .glass-card {
            background: #ffffff;
            border-radius: 24px;
            border: none;
            box-shadow: 0 10px 40px rgba(0,0,0,0.06);
            padding: 24px;
            margin-bottom: 20px;
        }

        .btn-primary { 
            background: linear-gradient(135deg, var(--primary), var(--primary-light)); 
            border: none; 
            box-shadow: 0 4px 15px rgba(30, 58, 138, 0.3);
            transition: all 0.3s ease;
        }
        .btn-primary:hover { 
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(30, 58, 138, 0.4);
        }

        /* Forms (Floating Labels) */
        .form-floating > .form-control, .form-floating > .form-select {
            border-radius: 16px;
            border: 1.5px solid #e2e8f0;
            background-color: #f8fafc;
        }
        .form-floating > .form-control:focus, .form-floating > .form-select:focus {
            border-color: var(--primary-light);
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        /* Document Item Card */
        .doc-item {
            background: #f8fafc;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 16px;
            border-left: 6px solid var(--primary-light);
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            transition: all 0.3s ease;
        }
        .doc-item:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0,0,0,0.06); }
        .doc-title { font-size: 1.15rem; font-weight: 600; color: var(--primary); margin-bottom: 6px; }
        .badge-custom { padding: 8px 14px; border-radius: 30px; font-weight: 500; font-size: 0.75rem; letter-spacing: 0.5px; }

        .file-pill {
            background: #e2e8f0; color: var(--primary);
            padding: 6px 14px; border-radius: 20px;
            text-decoration: none; font-size: 0.85rem; font-weight: 500;
            display: inline-block; margin-right: 6px; margin-bottom: 6px;
            transition: all 0.2s;
        }
        .file-pill:hover { background: var(--primary); color: #fff; }

        /* View Transition */
        .section-view { display: none; opacity: 0; transform: translateY(15px); transition: all 0.4s ease-out; }
        .section-view.active { display: block; opacity: 1; transform: translateY(0); }

        /* Bottom Navigation (Center FAB Style) */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            height: 75px; background: #ffffff;
            display: flex; justify-content: space-evenly; align-items: center;
            border-radius: 35px 35px 0 0;
            box-shadow: 0 -10px 25px rgba(0,0,0,0.06);
            z-index: 1000;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center;
            color: #94a3b8; cursor: pointer; transition: all 0.3s;
            width: 65px;
        }
        .nav-item.active { color: var(--primary); }
        .nav-item i { font-size: 1.3rem; margin-bottom: 5px; transition: transform 0.3s; }
        .nav-item.active i { transform: translateY(-3px); }
        .nav-item span { font-size: 0.75rem; font-weight: 500; }
        
        /* The Floating Action Button (FAB) */
        .fab-wrapper { position: relative; width: 75px; height: 75px; }
        .fab-button {
            position: absolute; top: -35px; left: 5px;
            width: 65px; height: 65px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            color: white; font-size: 1.6rem;
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4);
            border: 6px solid var(--bg-color);
            transition: transform 0.3s;
        }
        .fab-button:active { transform: scale(0.92); }

        /* Footer */
        .custom-footer { text-align: center; padding: 15px; font-size: 0.85rem; color: #64748b; font-weight: 500; }

        /* Loader Overlay */
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(8px);
            z-index: 9999; display: none; flex-direction: column; justify-content: center; align-items: center;
        }
        .spinner-grow { color: var(--primary-light); width: 4rem; height: 4rem; }
    </style>
</head>
<body>

    <!-- Background Curve -->
    <div class="header-curve">
        <div class="header-content text-center text-white">
            <h4 class="fw-bold mb-1" style="letter-spacing: 1px;"><i class="fas fa-layer-group me-2"></i>E-SARABUN PLUS</h4>
            <p class="small opacity-75">ระบบสารบรรณอิเล็กทรอนิกส์</p>
        </div>
    </div>

    <div class="container main-container">
        
        <!-- Banner Image Overlay -->
        <img src="https://i.postimg.cc/QxcK2wrM/baen-nex-r-E-SARANBUN-PLUS-mhasarkham.png" alt="Banner" class="custom-banner">

        <!-- 1. Dashboard View -->
        <div id="dashboard" class="section-view active">
            <div class="glass-card">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h5 class="text-primary fw-bold mb-0"><i class="fas fa-inbox me-2"></i>ทะเบียนหนังสือล่าสุด</h5>
                    <button class="btn btn-light rounded-circle shadow-sm" onclick="loadDocuments()" style="width:40px; height:40px; color: var(--primary);">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                </div>
                
                <div id="docContainer">
                    <div class="text-center p-5 text-muted">
                        <div class="spinner-border text-primary" role="status"></div>
                        <p class="mt-2">กำลังโหลดข้อมูล...</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 2. Receive Document View -->
        <div id="receive" class="section-view">
            <div class="glass-card">
                <h5 class="text-primary fw-bold mb-4 text-center"><i class="fas fa-pen-nib me-2"></i>ลงรับหนังสือใหม่</h5>
                <form id="receiveForm" onsubmit="handleReceiveSubmit(event)">
                    <div class="row g-3">
                        <div class="col-12">
                            <div class="form-floating">
                                <input type="text" class="form-control" id="docNum" placeholder="เลขหนังสือ" required>
                                <label>เลขหนังสือ</label>
                            </div>
                        </div>
                        <div class="col-12">
                            <div class="form-floating">
                                <input type="text" class="form-control" id="docFrom" placeholder="จาก" required>
                                <label>จาก (หน่วยงานต้นทาง)</label>
                            </div>
                        </div>
                        <div class="col-12">
                            <div class="form-floating">
                                <input type="text" class="form-control" id="docSubject" placeholder="เรื่อง" required>
                                <label>เรื่อง</label>
                            </div>
                        </div>
                        <div class="col-12">
                            <div class="form-floating">
                                <textarea class="form-control" id="docDetails" placeholder="รายละเอียด" style="height: 100px"></textarea>
                                <label>รายละเอียด (ถ้ามี)</label>
                            </div>
                        </div>
                        <div class="col-12">
                            <div class="form-floating">
                                <select class="form-select" id="docTo" required>
                                    <option value="">-- กำลังโหลดข้อมูล... --</option>
                                </select>
                                <label>ส่งถึง (ผอ.กลุ่ม/หัวหน้าฝ่าย)</label>
                            </div>
                        </div>
                        
                        <div class="col-12 mt-3">
                            <div class="p-3 bg-light rounded-4 border">
                                <label class="form-label text-muted small fw-bold mb-2"><i class="fas fa-paperclip me-1"></i>ไฟล์แนบ (อัปโหลดได้สูงสุด 3 ไฟล์)</label>
                                <input type="file" class="form-control form-control-sm mb-2" id="file1">
                                <input type="file" class="form-control form-control-sm mb-2" id="file2">
                                <input type="file" class="form-control form-control-sm" id="file3">
                            </div>
                        </div>

                        <div class="col-12 mt-4">
                            <button type="submit" class="btn btn-primary rounded-pill py-3 w-100 fw-bold fs-6">
                                <i class="fas fa-paper-plane me-2"></i>บันทึกและส่งข้อมูล
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- 3. Register View -->
        <div id="register" class="section-view">
            <div class="glass-card">
                <div class="text-center mb-4">
                    <h5 class="text-primary fw-bold"><i class="fas fa-user-shield me-2"></i>ลงทะเบียนบุคลากร</h5>
                    <p class="text-muted small">ระบบแจ้งเตือนผ่านอีเมลส่วนตัว</p>
                </div>
                
                <form id="registerForm" onsubmit="handleRegisterSubmit(event)">
                    <div class="row g-3">
                        <div class="col-12">
                            <div class="form-floating">
                                <input type="text" class="form-control" id="regName" placeholder="ชื่อ" required>
                                <label>ชื่อ - สกุล</label>
                            </div>
                        </div>
                        <div class="col-12">
                            <div class="form-floating">
                                <input type="text" class="form-control" id="regPosition" placeholder="ตำแหน่ง" required>
                                <label>ตำแหน่ง</label>
                            </div>
                        </div>
                        <div class="col-12">
                            <div class="form-floating">
                                <select class="form-select" id="regDept" required>
                                    <option value="บริหารทั่วไป">บริหารทั่วไป</option>
                                    <option value="ส่งเสริมศาสนา ศิลปะ และวัฒนธรรม">ส่งเสริมศาสนา ศิลปะ และวัฒนธรรม</option>
                                    <option value="ยุทธศาสตร์และเฝ้าระวังทางวัฒนธรรม">ยุทธศาสตร์และเฝ้าระวังทางวัฒนธรรม</option>
                                    <option value="พิธีการศพที่ได้รับพระราชทาน">พิธีการศพที่ได้รับพระราชทาน</option>
                                </select>
                                <label>กลุ่ม/ฝ่าย</label>
                            </div>
                        </div>
                        <div class="col-12">
                            <div class="form-floating">
                                <select class="form-select" id="regRole" required>
                                    <option value="เจ้าหน้าที่">เจ้าหน้าที่</option>
                                    <option value="ผอ.กลุ่ม/หัวหน้าฝ่าย">ผอ.กลุ่ม/หัวหน้าฝ่าย</option>
                                    <option value="วัฒนธรรมจังหวัด">วัฒนธรรมจังหวัด</option>
                                </select>
                                <label>สถานะ/บทบาท</label>
                            </div>
                        </div>
                        <div class="col-12">
                            <div class="form-floating">
                                <input type="email" class="form-control" id="regEmail" placeholder="อีเมล" required>
                                <label>อีเมลส่วนตัว</label>
                            </div>
                        </div>
                        <div class="col-12 mt-4">
                            <button type="submit" class="btn btn-primary rounded-pill py-3 w-100 fw-bold fs-6">
                                <i class="fas fa-check-circle me-2"></i>ยืนยันการลงทะเบียน
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        
        <!-- Footer -->
        <div class="custom-footer">
            นายอุทยาน ไพรวัลย์ นวธ. สวจ.มหาสารคาม : ผู้พัฒนาระบบ
        </div>

    </div>

    <!-- Center FAB Bottom Navigation -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('dashboard', this)">
            <i class="fas fa-home"></i>
            <span>หน้าหลัก</span>
        </div>
        
        <!-- Center Floating Button -->
        <div class="nav-item fab-wrapper" onclick="switchTab('receive', this)">
            <div class="fab-button">
                <i class="fas fa-plus"></i>
            </div>
            <span style="position: absolute; bottom: -20px; font-size: 0.75rem; font-weight: 500; color: #94a3b8; width: 100%; text-align: center;">ลงรับ</span>
        </div>
        
        <div class="nav-item" onclick="switchTab('register', this)">
            <i class="fas fa-user-cog"></i>
            <span>บุคลากร</span>
        </div>
    </div>

    <!-- Action Modal -->
    <div class="modal fade" id="actionModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="border-radius: 24px; border: none; overflow: hidden;">
                <div class="modal-header text-white" style="background: linear-gradient(135deg, var(--primary), var(--primary-light)); border: none;">
                    <h6 class="modal-title fw-bold"><i class="fas fa-tasks me-2"></i>จัดการเอกสาร</h6>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4 bg-light">
                    <input type="hidden" id="actionDocId">
                    <div class="form-floating mb-3">
                        <select class="form-select bg-white" id="actionAssignTo"></select>
                        <label>มอบหมายงานให้</label>
                    </div>
                    <div class="form-floating mb-3">
                        <select class="form-select bg-white" id="actionStatus">
                            <option value="มอบหมายแล้ว">มอบหมายแล้ว (กำลังดำเนินการ)</option>
                            <option value="ตีกลับ/แก้ไข">ตีกลับ/แก้ไขข้อมูล</option>
                            <option value="เสร็จสิ้น">ดำเนินการเสร็จสิ้น</option>
                        </select>
                        <label>อัปเดตสถานะ</label>
                    </div>
                    <div class="form-floating">
                        <textarea class="form-control bg-white" id="actionNote" placeholder="หมายเหตุ" style="height: 90px"></textarea>
                        <label>ข้อความสั่งการ / หมายเหตุ</label>
                    </div>
                </div>
                <div class="modal-footer bg-light border-0 pt-0 justify-content-center pb-4">
                    <button type="button" class="btn btn-secondary rounded-pill px-4" data-bs-dismiss="modal">ยกเลิก</button>
                    <button type="button" class="btn btn-primary rounded-pill px-5 shadow" onclick="submitAction()">บันทึก</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Animated Loader -->
    <div id="loader">
        <div class="spinner-grow mb-3" role="status"></div>
        <h5 class="text-primary fw-bold" id="loaderText">กำลังประมวลผล...</h5>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // ==========================================
        // URL Web App จาก Google Apps Script (ที่ให้มา)
        // ==========================================
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbwpv28EecHmC1NqAkxh2ftKJxJnyQMxLE6WOBJFVB2g7_3_9k5O9szYui59fdapGC07/exec'; 
        
        let usersData = [];
        let actionModal;

        const Toast = Swal.mixin({
            toast: true, position: 'top-end', showConfirmButton: false, timer: 3000,
            timerProgressBar: true, customClass: { popup: 'swal2-custom-font' }
        });

        const style = document.createElement('style');
        style.innerHTML = `.swal2-popup { font-family: 'Prompt', sans-serif !important; border-radius: 20px !important; }`;
        document.head.appendChild(style);

        document.addEventListener('DOMContentLoaded', () => {
            actionModal = new bootstrap.Modal(document.getElementById('actionModal'));
            loadUsers();
            loadDocuments();
        });

        function switchTab(tabId, el) {
            document.querySelectorAll('.section-view').forEach(e => {
                e.classList.remove('active');
                setTimeout(() => e.style.display = 'none', 10);
            });
            
            const target = document.getElementById(tabId);
            setTimeout(() => {
                target.style.display = 'block';
                setTimeout(() => target.classList.add('active'), 50);
            }, 50);

            // จัดการสีไอคอน Bottom Nav
            document.querySelectorAll('.nav-item').forEach(e => {
                e.classList.remove('active');
                if(e.querySelector('span')) e.querySelector('span').style.color = '#94a3b8';
                if(e.classList.contains('fab-wrapper')) e.querySelector('.fab-button').style.transform = 'scale(1)';
            });
            
            el.classList.add('active');
            if(el.querySelector('span') && !el.classList.contains('fab-wrapper')) {
                el.querySelector('span').style.color = 'var(--primary)';
            }
            if(el.classList.contains('fab-wrapper')) {
                el.querySelector('.fab-button').style.transform = 'scale(1.1)';
                el.querySelector('span').style.color = 'var(--primary)';
            }
            
            if(tabId === 'dashboard') loadDocuments();
            if(tabId === 'receive') populateManagers();
        }

        function showLoader(text) {
            document.getElementById('loaderText').innerText = text;
            document.getElementById('loader').style.display = 'flex';
        }
        function hideLoader() { document.getElementById('loader').style.display = 'none'; }

        function formatDate(dateStr) {
            if(!dateStr) return '';
            const d = new Date(dateStr);
            const months = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
            return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()+543} เวลา ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')} น.`;
        }

        async function fetchGAS(action, payload) {
            try {
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: action, payload: payload })
                });
                const result = await response.json();
                if(result.status === 'success') return result.data;
                else throw new Error(result.message);
            } catch (error) {
                Swal.fire({icon: 'error', title: 'ข้อผิดพลาด', text: error.message || 'การเชื่อมต่อขัดข้อง', confirmButtonColor: '#1e3a8a'});
                return null;
            }
        }

        async function loadUsers() {
            const data = await fetchGAS('getUsers', {});
            if(data) {
                usersData = data;
                populateManagers();
                populateStaff();
            }
        }

        function populateManagers() {
            const select = document.getElementById('docTo');
            select.innerHTML = '<option value="">-- เลือก ผอ./หัวหน้า --</option>';
            const managers = usersData.filter(u => u['สถานะ'] === 'ผอ.กลุ่ม/หัวหน้าฝ่าย' || u['สถานะ'] === 'วัฒนธรรมจังหวัด');
            managers.forEach(u => {
                select.innerHTML += `<option value="${u['ชื่อ-สกุล']}" data-email="${u['อีเมล']}">${u['ชื่อ-สกุล']} (${u['กลุ่ม/ฝ่าย']})</option>`;
            });
        }
        
        function populateStaff() {
            const select = document.getElementById('actionAssignTo');
            select.innerHTML = '<option value="-">-- ไม่ระบุ / ตีกลับ --</option>';
            const staffs = usersData.filter(u => u['สถานะ'] === 'เจ้าหน้าที่');
            staffs.forEach(u => {
                select.innerHTML += `<option value="${u['ชื่อ-สกุล']}" data-email="${u['อีเมล']}">${u['ชื่อ-สกุล']} (${u['กลุ่ม/ฝ่าย']})</option>`;
            });
        }

        async function handleRegisterSubmit(e) {
            e.preventDefault();
            const payload = {
                name: document.getElementById('regName').value,
                position: document.getElementById('regPosition').value,
                department: document.getElementById('regDept').value,
                role: document.getElementById('regRole').value,
                email: document.getElementById('regEmail').value
            };
            showLoader('กำลังบันทึกข้อมูลบุคลากร...');
            const res = await fetchGAS('register', payload);
            hideLoader();
            if(res) {
                Swal.fire({ title: 'สำเร็จ!', text: 'ลงทะเบียนเข้าสู่ระบบเรียบร้อย', icon: 'success', confirmButtonColor: '#1e3a8a' });
                document.getElementById('registerForm').reset();
                loadUsers();
            }
        }

        function getBase64(file) {
            return new Promise((resolve, reject) => {
                if(!file) return resolve(null);
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve({ name: file.name, mimeType: file.type, base64: reader.result });
                reader.onerror = error => reject(error);
            });
        }

        async function handleReceiveSubmit(e) {
            e.preventDefault();
            const toSelect = document.getElementById('docTo');
            const selectedOption = toSelect.options[toSelect.selectedIndex];
            
            showLoader('กำลังอัปโหลดไฟล์และส่งอีเมลแจ้งเตือน...');
            const files = [];
            for (let i = 1; i <= 3; i++) {
                const f = document.getElementById(`file${i}`).files[0];
                if(f) files.push(await getBase64(f));
            }

            const payload = {
                docNum: document.getElementById('docNum').value,
                from: document.getElementById('docFrom').value,
                subject: document.getElementById('docSubject').value,
                details: document.getElementById('docDetails').value,
                toName: selectedOption.value,
                toEmail: selectedOption.dataset.email,
                files: files
            };

            const res = await fetchGAS('submitDoc', payload);
            hideLoader();
            if(res) {
                Swal.fire({ title: 'ส่งสำเร็จ', text: 'ระบบส่งหนังสือและแจ้งเตือนเรียบร้อย', icon: 'success', confirmButtonColor: '#1e3a8a' });
                document.getElementById('receiveForm').reset();
                switchTab('dashboard', document.querySelectorAll('.nav-item')[0]);
            }
        }

        async function loadDocuments() {
            showLoader('กำลังดึงข้อมูลหนังสือ...');
            const data = await fetchGAS('getDocs', {});
            hideLoader();
            
            const container = document.getElementById('docContainer');
            container.innerHTML = '';
            
            if(!data || data.length === 0) {
                container.innerHTML = `
                    <div class="text-center p-5 text-muted">
                        <i class="fas fa-folder-open fa-3x mb-3" style="color: #cbd5e1;"></i>
                        <br>ไม่มีรายการหนังสือในขณะนี้
                    </div>`;
                return;
            }
            
            data.forEach(doc => {
                let badgeClass = 'bg-secondary';
                if(doc['สถานะ'] === 'รอการพิจารณา') badgeClass = 'bg-warning text-dark';
                if(doc['สถานะ'] === 'มอบหมายแล้ว') badgeClass = 'bg-info text-dark';
                if(doc['สถานะ'].includes('ตีกลับ')) badgeClass = 'bg-danger';
                if(doc['สถานะ'] === 'เสร็จสิ้น') badgeClass = 'bg-success';

                let filesHtml = '';
                if(doc['ไฟล์ 1']) filesHtml += `<a href="${doc['ไฟล์ 1']}" target="_blank" class="file-pill"><i class="fas fa-file-pdf"></i> เอกสาร 1</a>`;
                if(doc['ไฟล์ 2']) filesHtml += `<a href="${doc['ไฟล์ 2']}" target="_blank" class="file-pill"><i class="fas fa-file-pdf"></i> เอกสาร 2</a>`;
                if(doc['ไฟล์ 3']) filesHtml += `<a href="${doc['ไฟล์ 3']}" target="_blank" class="file-pill"><i class="fas fa-file-pdf"></i> เอกสาร 3</a>`;

                const cardHtml = `
                    <div class="doc-item">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <span class="badge ${badgeClass} badge-custom shadow-sm">${doc['สถานะ']}</span>
                            <small class="text-muted"><i class="far fa-clock me-1"></i>${formatDate(doc['วันที่ลงรับ'])}</small>
                        </div>
                        <div class="doc-title"><i class="fas fa-hashtag me-1 text-muted fs-6"></i> ${doc['เลขหนังสือ']}</div>
                        <p class="mb-3 text-dark fw-medium lh-sm">${doc['เรื่อง']}</p>
                        
                        <div class="d-flex flex-column mb-3" style="font-size: 0.9rem; color: #475569;">
                            <div class="mb-1"><i class="fas fa-building me-2 text-primary"></i>จาก: ${doc['จาก']}</div>
                            <div class="mb-1"><i class="fas fa-user-tie me-2 text-primary"></i>ถึง: ${doc['ถึง']}</div>
                            ${doc['ผู้รับผิดชอบ'] !== '-' ? `<div class="text-success fw-bold"><i class="fas fa-user-check me-2"></i>ผู้รับผิดชอบ: ${doc['ผู้รับผิดชอบ']}</div>` : ''}
                        </div>
                        
                        ${filesHtml ? `<div class="mb-3 bg-white p-2 rounded-3 border">${filesHtml}</div>` : ''}
                        
                        <div class="pt-2 d-flex justify-content-end align-items-center">
                            <button class="btn btn-sm btn-primary rounded-pill px-4 shadow-sm me-2 fw-bold" onclick="openActionModal('${doc['DocID']}')">อัปเดตสถานะ</button>
                            <button class="btn btn-sm btn-light rounded-circle shadow-sm text-danger d-flex justify-content-center align-items-center" onclick="deleteDoc('${doc['DocID']}')" style="width: 35px; height: 35px;">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHtml;
            });
        }

        function openActionModal(docId) {
            document.getElementById('actionDocId').value = docId;
            document.getElementById('actionAssignTo').value = '-';
            document.getElementById('actionStatus').value = 'มอบหมายแล้ว';
            document.getElementById('actionNote').value = '';
            actionModal.show();
        }

        async function submitAction() {
            const docId = document.getElementById('actionDocId').value;
            const assignSelect = document.getElementById('actionAssignTo');
            const assignedTo = assignSelect.value;
            let targetEmail = '';
            
            if(assignedTo !== '-') {
                const opt = assignSelect.options[assignSelect.selectedIndex];
                targetEmail = opt.dataset.email;
            }

            const payload = {
                docId: docId,
                status: document.getElementById('actionStatus').value,
                assignedTo: assignedTo,
                note: document.getElementById('actionNote').value,
                targetEmail: targetEmail
            };

            actionModal.hide();
            showLoader('กำลังอัปเดตข้อมูลและส่งอีเมลแจ้งเตือน...');
            const res = await fetchGAS('updateDocStatus', payload);
            hideLoader();
            
            if(res) {
                Toast.fire({ icon: 'success', title: 'อัปเดตสถานะเอกสารสำเร็จ' });
                loadDocuments();
            }
        }

        async function deleteDoc(docId) {
            const confirm = await Swal.fire({
                title: 'ยืนยันการลบ?',
                text: 'คุณต้องการลบหนังสือรหัสนี้ใช่หรือไม่? (ไม่สามารถกู้คืนได้)',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#dc3545',
                cancelButtonColor: '#64748b',
                confirmButtonText: 'ใช่, ลบข้อมูล',
                cancelButtonText: 'ยกเลิก'
            });

            if(confirm.isConfirmed) {
                showLoader('กำลังลบข้อมูล...');
                const res = await fetchGAS('deleteDoc', { id: docId });
                hideLoader();
                if(res) {
                    Toast.fire({ icon: 'success', title: 'ลบข้อมูลเรียบร้อยแล้ว' });
                    loadDocuments();
                }
            }
        }
    </script>
</body>
</html>
